# Nginx site for api.aaboo.tech -> the Node server on 127.0.0.1:4000.
# Certbot adds the HTTPS (443) block to this file automatically.
server {
    listen 80;
    server_name api.aaboo.tech;

    # Media uploads go straight to Supabase via signed URLs, so API bodies
    # stay small; this is just headroom for JSON payloads.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Socket.io (live location, SOS) needs the WebSocket upgrade headers.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep idle sockets open instead of Nginx's 60s default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
